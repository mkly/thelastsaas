name: Release

on:
  push:
    tags:
      - "server-v*"
      - "cli-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Check release version
        id: version
        run: |
          bun -e '
            import { appendFileSync } from "node:fs";
            import { version as serverVersion } from "./packages/server/package.json";
            import { version as cliVersion } from "./packages/client/package.json";
            const tag = process.env.GITHUB_REF_NAME;
            const component = tag?.startsWith("server-v") ? "server" : "cli";
            const version = component === "server" ? serverVersion : cliVersion;
            const expected = `${component}-v${version}`;
            if (tag !== expected) {
              throw new Error(`Release tag must be ${expected}, got ${tag}`);
            }
            const notes = component === "server"
              ? `Server ${serverVersion}. Bundled CLI ${cliVersion}.`
              : `CLI ${cliVersion}.`;
            appendFileSync(process.env.GITHUB_OUTPUT, `component=${component}\nnotes=${notes}\n`);
          '

      - run: bun run --cwd packages/server prisma:generate

      - run: bun run typecheck

      - run: bun test

      - name: Build server binaries
        if: steps.version.outputs.component == 'server'
        run: |
          mkdir -p release
          bun run build:server
          mv dist/saas-server release/saas-server-linux-x64
          bun run build:server:postgres
          mv dist/saas-server release/saas-server-postgres-linux-x64

      - name: Build CLI binaries
        if: steps.version.outputs.component == 'cli'
        run: |
          mkdir -p release
          bun run build:client:all
          cp dist/saas-linux-* dist/saas-darwin-* dist/saas-windows-x64.exe release/

      - name: Checksums
        run: |
          cd release
          sha256sum saas-* > SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: ${{ steps.version.outputs.notes }}
          files: release/*
