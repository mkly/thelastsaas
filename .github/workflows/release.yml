name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run --cwd packages/server prisma:generate

      - run: bun run typecheck

      - run: bun test

      - name: Build server (SQLite) and CLI binaries
        run: |
          bun run build:server
          mv dist/saas-server dist/saas-server-linux-x64

      - name: Build server (PostgreSQL)
        run: |
          bun run build:server:postgres
          mv dist/saas-server dist/saas-server-postgres-linux-x64

      - name: Checksums
        run: |
          cd dist
          sha256sum saas-server-* saas-linux-* saas-darwin-* saas-windows-x64.exe > SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/saas-server-linux-x64
            dist/saas-server-postgres-linux-x64
            dist/saas-linux-x64
            dist/saas-linux-arm64
            dist/saas-darwin-x64
            dist/saas-darwin-arm64
            dist/saas-windows-x64.exe
            dist/SHA256SUMS.txt
